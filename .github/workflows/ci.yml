name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed local knowledge lake
        run: python data/seed_knowledge.py
      - name: Run retrieval demo
        run: python run_demo.py
      - name: Run tests
        run: python -m pytest tests/ -q
